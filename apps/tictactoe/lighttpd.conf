# The tic-tac-toe page, served from inside the application's container. The container
# shares the router's network, so the page is at the router's addresses; 8090 because the
# router itself has 80, 8080 and 8888.
# lighttpd loads these three whatever is said here, so all three are in the bundle
server.modules       = ( "mod_indexfile", "mod_dirlisting", "mod_staticfile" )

server.document-root = "/srv/tictactoe"
server.port          = 8090
# no server.errorlog: lighttpd then writes to its stderr, which the framework collects.
# Naming /dev/stderr does not work: it is a socket there, and a socket cannot be opened.
server.bind          = "0.0.0.0"
# the container's /var is an empty tmpfs: lighttpd's default, /var/tmp, is not there
server.upload-dirs   = ( "/tmp" )

index-file.names     = ( "index.html" )

mimetype.assign = (
    ".html" => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".svg"  => "image/svg+xml",
    ".txt"  => "text/plain"
)
