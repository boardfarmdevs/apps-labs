# The LCM image: the apps toolkit on the prpl lifecycle manager instead of its default, DAC.
# From meta-cmf-bananapi-vcpe doc/dac-lcm; build-images.sh puts this in conf/local.conf.
RDK_BB_APPS_TOOLKIT_CRUNTIME = "LCM"

# meta-lcm ships cmake 3.18.4 pinned to dunfell; mask it so OE's 3.22.3 wins
BBMASK_append = "|meta-lcm/recipes-devtools/cmake/"

# OCI bundles run by crun instead of LXC in LXC
DISTRO_FEATURES_remove = "lcm-images lxc-backend"
DISTRO_FEATURES_append = " lcm-bundles crun-backend "

# The layer's cthulhu patch (0001-cgroup-v2-tolerance) was written for the cthulhu of
# prplOS 3.1.0 and does not compile against the one prplware 4.1.0 brings (v4.3.0), which
# handles cgroup v2 itself (a version per controller).
SRC_URI_remove_pn-cthulhu = "file://0001-cgroup-v2-tolerance.patch"

# The bundle packager's plugin for timingila: meta-lcm at prplware 4.1.0 pins v1.0.1, which
# does not answer the validation step timingila 3.1.5 puts before a pull, so InstallDU
# never gets past it. v1.1.0 ("Cthulhu API validation") does.
SRCREV_pn-timingila-celephais = "b0a0b1f28500ff17ad20b23980404a0f78750e43"

# cthulhu makes a user for every container that is not installed as privileged
# ("useradd -r cthulhu_<n>"); the image has busybox's adduser only.
IMAGE_INSTALL_append = " shadow"
# ... and an image with a read-only root, as this one is declared, has shadow taken out
# again when its root filesystem is finished.
ROOTFS_RO_UNNEEDED_remove = "shadow"
